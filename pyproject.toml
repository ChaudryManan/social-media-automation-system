[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-automation"
version = "0.1.0"
description = "Social media multi-agent automation platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic==1.16.1",
    "argon2-cffi==23.1.0",
    "celery==5.5.3",
    "cryptography==45.0.3",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "langchain-core==0.3.61",
    "langgraph==0.4.7",
    "langgraph-checkpoint==2.0.26",
    "langgraph-checkpoint-postgres==2.0.23",
    "langgraph-prebuilt==0.2.3",
    "psycopg[binary]==3.2.9",
    "psycopg-pool==3.3.3",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "PyJWT==2.10.1",
    "redis==6.2.0",
    "SQLAlchemy==2.0.41",
    "tzdata==2025.2",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.12",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app.agents.prompts" = ["*.md", "fragments/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: marks integration tests requiring running services",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
